name: Sauna watch

on:
  # GitHub's scheduler is best-effort and in practice fires only every few hours,
  # so an external cron (cron-job.org, see README) triggers workflow_dispatch
  # every 5 min. The schedule stays as a fallback.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:         # external cron + "Run workflow" button

permissions:
  contents: read

concurrency:
  group: sauna-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # state.json (prevents duplicate alerts) lives in the Actions cache, not the
      # repo, so the watched slots are never published. Cache keys are immutable,
      # so each run saves a new key and the next run restores the latest one.
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: sauna-state-${{ github.run_id }}
          restore-keys: sauna-state-
      - name: Check availability
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCHES: ${{ vars.WATCHES }}   # optional: overrides watches.yml if set
        run: python watch.py
      - name: Save state
        if: steps.check.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: sauna-state-${{ github.run_id }}
